[package]
name = "paseo-lite"
version = "0.1.0"
edition = "2021"
description = "Low-resource Rust daemon for Claude Code and Codex agents, compatible with the Paseo relay"
license-file = "LICENSE"

[[bin]]
name = "paseo-lite"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "process", "io-util", "sync", "time", "fs", "signal"] }
axum = { version = "0.7", default-features = false, features = ["ws", "http1", "tokio"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crypto_box = { version = "0.9", features = ["salsa20", "getrandom"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
humantime = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
